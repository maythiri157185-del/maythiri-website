<!DOCTYPE html>
<html>
<head>
  <style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .container {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 380px;
        height: auto;
        border: 1px solid #ccc;
        border-radius: 25px;
        box-shadow: 3px 2px 10px rgb(117, 117, 117);
    }
    #items{
        margin-bottom: 25px;
    }    
  </style>
</head>
<body>
  <div class="container">
    <div id="items">
      <h2>Measurement Converter</h2>
      <span>Enter Inch:</span>
      <input type="number" id="typeNumber"></input>
      <button type="button" onclick="myFunction()" style="width: 75px; height: auto;">Submit</button>
      <p id="demo">Equal to: </p>
      <button onclick="location.href='index.html'">Back</button>
    </div>

  </div>

  <script>
    function myFunction(){
      let a = document.getElementById("typeNumber").value;
      if (a === ""){
        alert("Please enter a value.");
        return;
      }
      let x = Number(a);
      if (isNaN(x) || x < 0){
        alert ("Please enter a vaild number.");
        return;
      } 
      let y = x * 2.54;
      document.getElementById("demo").innerText = "Equal to: " + y + " cm"
    }
  </script>

</body>
</html>
