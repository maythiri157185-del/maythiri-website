<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculate Change</title>

    <style>

        body {
            margin: 0;
            padding: 30px;

            font-family: "Times New Roman", serif;

            background-color: #eaf4ff;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 380px;
            max-width: 90%;

            height: auto;

            border: 1px solid #ccc;
            border-radius: 25px;

            box-shadow: 3px 2px 10px rgb(117, 117, 117);

            background-color: white;

            padding: 25px 30px;
        }

        #items {
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
            font-size: 32px;
        }

        input {
            height: 22px;
            font-size: 16px;
        }

        button {
            font-size: 16px;
            padding: 3px 10px;
            cursor: pointer;
        }

        #result {
            font-size: 18px;
            line-height: 1.6;
        }


        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .container {
                width: 100%;
                max-width: 380px;

                padding: 20px;
            }

            h2 {
                font-size: 28px;
            }

            input {
                width: 100%;
                max-width: 210px;

                box-sizing: border-box;

                margin-top: 8px;
            }

            #items > button {
                margin-top: 8px;
            }

        }


        /* Very small phones */

        @media (max-width: 380px) {

            .container {
                padding: 18px;
            }

            h2 {
                font-size: 25px;
            }

            input {
                max-width: 100%;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div id="items">

            <h2>Calculate Change</h2>

            <span>Enter Amount:</span>

            <input
                type="number"
                id="amount"
                required>

            <button onclick="calculateChange()">
                Submit
            </button>

            <p id="result">
            </p>

            <button onclick="location.href='index.html'">
                Back
            </button>

        </div>

    </div>


    <script>

        function calculateChange() {
            let change = [1000,500,100,50,20,10,5,2,1]
            let amount = Number(document.getElementById("amount").value);
            let result = "";
            if (amount<0){
                alert("Please fill valid change.")
                return
            }

            for (let i=0; i<change.length;i++) {
                let count = 0;
                while (amount>=change[i]){
                    amount -= change[i];
                    count++;
                }

                if (count>0) {
                    result += count + " of   $" + change[i] + "<br>";
                }
            }
            document.getElementById("result").innerHTML = result;
        }

    </script>

</body>

</html>
