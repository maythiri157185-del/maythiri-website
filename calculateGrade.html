<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 380px;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 25px;
            box-shadow: 3px 2px 10px rgb(117, 117, 117);
        }
        #items{
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="items">
            <h2>Calculate Grade</h2>
            <span>Enter Amount:</span>
            <input type="number" id="amount">
            <button onclick="calculateGrade()">Submit</button>
            <p id="result">You got ... </p>
            <button onclick="location.href='index.html'">Back</button>
        </div>
            

        
    </div>

    <script>
        function calculateGrade() {
            let amount = document.getElementById("amount").value;
            let grade;
            if (isNaN(amount) || amount<0 || amount>100){
                alert("The marks you fill is invalid.");
                return;
            }
            if (amount<=100) {
                if (amount >= 85) {
                    grade = " an A";
                } else if (amount >= 80) {
                    grade = "a B";
                } else if (amount >= 70) {
                    grade = "a C";
                } else if (amount >= 60) {
                    grade = "a D";
                } else {
                    grade = "a F";
                }
                document.getElementById("result").innerHTML = "You got " + grade;
            } else {
                document.getElementById("result").innerHTML = "Invalid amount. Please enter a value between 0 and 100.";
            }        
        }
    </script>

</body>
</html>
