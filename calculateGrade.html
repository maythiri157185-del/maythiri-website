<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculate Grade</title>

    <style>

        body {
            margin: 0;
            padding: 30px;

            font-family: "Times New Roman", serif;

            background-color: #eaf4ff;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 380px;
            max-width: 90%;

            height: auto;

            border: 1px solid #ccc;
            border-radius: 25px;

            box-shadow: 3px 2px 10px rgb(117, 117, 117);

            background-color: white;

            padding: 25px 30px;
        }

        #items {
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
            font-size: 32px;
        }

        input {
            height: 22px;
            font-size: 16px;
        }

        button {
            font-size: 16px;
            padding: 3px 10px;
            cursor: pointer;
        }

        #result {
            font-size: 18px;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .container {
                width: 100%;
                max-width: 380px;

                padding: 20px;
            }

            h2 {
                font-size: 28px;
            }

            input {
                width: 100%;
                max-width: 210px;

                box-sizing: border-box;

                margin-top: 8px;
            }

            #items > button {
                margin-top: 8px;
            }
        }

        @media (max-width: 380px) {

            .container {
                padding: 18px;
            }

            h2 {
                font-size: 25px;
            }

            input {
                max-width: 100%;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div id="items">

            <h2>Calculate Grade</h2>

            <span>Enter Amount:</span>

            <input type="number" id="amount">

            <button onclick="calculateGrade()">
                Submit
            </button>

            <p id="result">
                You got ...
            </p>

            <button onclick="location.href='index.html'">
                Back
            </button>

        </div>

    </div>


    <script>

        function calculateGrade() {
            let amount = document.getElementById("amount").value;
            let grade;
            if (isNaN(amount) || amount<0 || amount>100){
                alert("The marks you fill is invalid.");
                return;
            }
            if (amount<=100) {
                if (amount >= 85) {
                    grade = " an A";
                } else if (amount >= 80) {
                    grade = "a B";
                } else if (amount >= 70) {
                    grade = "a C";
                } else if (amount >= 60) {
                    grade = "a D";
                } else {
                    grade = "a F";
                }
                document.getElementById("result").innerHTML = "You got " + grade;
            } else {
                document.getElementById("result").innerHTML = "Invalid amount. Please enter a value between 0 and 100.";
            }        
        }

    </script>

</body>

</html>
