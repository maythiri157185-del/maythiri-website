<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Distance from University</title>

    <style>

        body {
            margin: 0;
            padding: 30px 20px;

            font-family: Arial, sans-serif;

            background-color: #eaf4ff;

            text-align: center;
        }

        h2 {
            color: #0800ff;
            font-size: 28px;
        }

        .description {
            color: #333;
            font-size: 17px;
            line-height: 1.5;
            margin: 15px auto 25px;
            max-width: 450px;
        }

        button {
            background-color: #007bff;
            color: white;

            border: none;
            border-radius: 6px;

            padding: 12px 25px;

            font-size: 16px;

            margin: 10px;

            cursor: pointer;
        }

        button:hover {
            background-color: #0800ff;
        }

        #demo {
            margin: 20px auto;

            padding: 15px;

            max-width: 400px;

            background-color: white;

            border-radius: 8px;

            color: #333;

            font-size: 16px;

            line-height: 1.6;
        }

        @media (max-width: 600px) {

            body {
                padding: 25px 15px;
            }

            h2 {
                font-size: 24px;
            }

            .description {
                font-size: 16px;
            }

            button {
                width: 90%;
                max-width: 300px;
            }

            #demo {
                width: 90%;
                max-width: 350px;
            }

        }

    </style>

</head>

<body>

    <h2>Distance from University</h2>

    <p class="description">
        Find your current location and check your distance from the university.
    </p>

    <button onclick="getLocation()">
        Try it
    </button>

    <p id="demo"></p>

    <button onclick="location.href='index.html'">
        ← Back to Assignments
    </button>


    <script>

        const a = document.getElementById("demo");

        function getLocation() {

            try {

                navigator.geolocation.getCurrentPosition(showPosition);

            } catch(err) {

                a.innerHTML = err;

            }

        }

        function showPosition(position) {

            let x = position.coords.latitude;

            let y = position.coords.longitude;

            a.innerHTML =
                "Latitude: " + x +
                "<br>Longitude: " + y;

            calculateDistanceUni(x, y);

        }

        function calculateDistanceUni(x, y) {

            let distance = Math.sqrt(x * x + y * y);

            document.getElementById("demo").innerHTML =
                "Distance: " + distance;

        }

    </script>

</body>

</html>
